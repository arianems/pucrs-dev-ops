name: Infra - Apply Terraform Changes

on:
  workflow_dispatch

env:
    AWS_REGION: ${{ vars.AWS_REGION }}               
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}  
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    
    TF_VAR_aws_region: ${{ vars.AWS_REGION }}
    TF_VAR_aws_ecr_repository: ${{ vars.ECR_REPOSITORY_NAME }}
    TF_VAR_aws_ecs_cluster: ${{ vars.ECS_CLUSTER_NAME }}
    TF_VAR_aws_ecs_service: ${{ vars.ECS_SERVICE_NAME }}

jobs:
  terraform:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    environment: dev

    defaults:
      run:
        working-directory: ./infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@0e613a0980cbf65ed5b322eb7a1e075d28913a83
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_LOG: INFO
        run: terraform plan -refresh=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan